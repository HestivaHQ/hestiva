name: Close performance audit documentation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Update final performance records
        shell: python
        run: |
          from pathlib import Path

          audit = Path("docs/PERFORMANCE_AUDIT.md")
          text = audit.read_text()
          old = "This favicon change removes roughly 2.30 MB of avoidable transfer without changing favicon URLs, metadata semantics, routing, or visual branding intent. A final production Lighthouse run is still required after deployment before the performance audit is closed."
          new = """This favicon change removes roughly 2.30 MB of avoidable transfer without changing favicon URLs, metadata semantics, routing, or visual branding intent.

## Final production verification and audit closure

GitHub Actions run `31495511555` audited production from merged `main` commit `e87a1794ffab3a27b25daef70bc90f4dd554cbe7` after the favicon correction, using the same three-run mobile method. Median values were:

| Page | Performance | FCP | LCP | Total transfer | TBT | CLS |
| --- | ---: | ---: | ---: | ---: | ---: | ---: |
| Homepage | 93 | 2.40 s | 2.72 s | 240 KB | 0 ms | 0 |
| Services | 95 | 2.34 s | 2.41 s | 308 KB | 0 ms | 0 |
| Quote | 93 | 2.55 s | 2.55 s | 196 KB | 0 ms | 0 |

Compared with the original verified baseline, total transfer fell from 5.328 MB to 240 KB on the homepage, from 9.692 MB to 308 KB on Services, and from 3.014 MB to 196 KB on Quote. The median homepage and Services performance scores remained in the low-to-mid 90s after the favicon fix.

One homepage run scored materially lower because of a temporary Total Blocking Time spike rather than renewed image-transfer growth. The median homepage transfer remained 240 KB and the other two homepage runs scored 93, so the run is recorded as measurement volatility rather than evidence of an unresolved static-asset regression.

The evidence-backed performance audit is therefore **closed**. The measured application-owned bottlenecks identified in this audit were corrected, deployed, and re-measured in production. Further performance changes require new production evidence rather than speculative refactoring."""
          if old not in text:
              raise SystemExit("Expected favicon closure text not found")
          text = text.replace(old, new)
          text = text.replace(
              "Global client-side internal navigation is corrected through PR #108. The first production Lighthouse baseline then identified image transfer as the material evidence-backed bottleneck, leading to responsive WebP delivery in PR #110. Further performance work should be driven by the post-deployment Lighthouse comparison rather than speculative source refactoring.",
              "Global client-side internal navigation is corrected through PR #108. The first production Lighthouse baseline then identified image transfer as the material evidence-backed bottleneck, leading to responsive WebP delivery in PR #110 and the favicon correction in PR #111. Final production run `31495511555` verified median performance scores of 93, 95, and 93 for the homepage, Services, and Quote pages respectively, with transfer reduced to 240 KB, 308 KB, and 196 KB. The performance audit is closed; future optimization work must be driven by new production evidence rather than speculative source refactoring."
          )
          audit.write_text(text)

          log = Path("docs/TECHNICAL_WORK_LOG.md")
          text = log.read_text()
          marker = "## 2026-08-11 — Corrected oversized favicon assets after post-WebP production measurement"
          entry = """## 2026-08-11 — Closed the production performance audit after final verification

**Purpose:** Record the final production measurement after the favicon correction and formally close the evidence-backed website performance audit.

**Work recorded:**

- reviewed successful Lighthouse production run `31495511555` from merged `main` commit `e87a1794ffab3a27b25daef70bc90f4dd554cbe7` using the same three-run mobile method as the earlier measurements;
- recorded median homepage performance `93`, FCP `2.40 s`, LCP `2.72 s`, transfer `240 KB`, TBT `0 ms`, and CLS `0`;
- recorded median Services performance `95`, FCP `2.34 s`, LCP `2.41 s`, transfer `308 KB`, TBT `0 ms`, and CLS `0`;
- recorded median Quote performance `93`, FCP/LCP `2.55 s`, transfer `196 KB`, TBT `0 ms`, and CLS `0`;
- confirmed transfer fell from the original baseline of `5.328 MB`, `9.692 MB`, and `3.014 MB` to `240 KB`, `308 KB`, and `196 KB` respectively;
- retained one lower homepage run as documented measurement volatility because the anomaly was a temporary blocking-time spike rather than a return of oversized static-asset transfer; and
- formally closed the performance audit without introducing any new runtime code, dependency, deployment, pricing, quote-flow, or Website ↔ HestivaOS integration change.

**Verification:** GitHub Actions run `31495511555` completed successfully and uploaded the production Lighthouse artifact for `main` commit `e87a1794ffab3a27b25daef70bc90f4dd554cbe7`.

"""
          if marker not in text:
              raise SystemExit("Technical work log insertion marker not found")
          log.write_text(text.replace(marker, entry + marker))

          changelog = Path("docs/CHANGELOG.md")
          text = changelog.read_text()
          marker = "- Verified the post-WebP production improvement, then corrected the two remaining oversized favicon files from 1254×1254 source images to true 16×16 and 32×32 optimized PNGs, reducing them from roughly 2.30 MB combined to 2,521 bytes while preserving their existing public paths (PR #111)."
          replacement = marker + "\n- Closed the performance audit after final production run `31495511555` verified median performance scores of 93/95/93 for Homepage/Services/Quote and reduced transfer to 240 KB/308 KB/196 KB respectively, with no further evidence-backed application performance change required."
          if marker not in text:
              raise SystemExit("Changelog insertion marker not found")
          changelog.write_text(text.replace(marker, replacement))

      - name: Commit documentation and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PERFORMANCE_AUDIT.md docs/TECHNICAL_WORK_LOG.md docs/CHANGELOG.md
          git rm .github/workflows/close-performance-audit-docs.yml
          git commit -m "docs: close production performance audit"
          git push origin "HEAD:${{ github.head_ref }}"
