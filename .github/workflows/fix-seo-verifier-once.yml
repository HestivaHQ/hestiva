name: Fix SEO verifier once

on:
  push:
    branches:
      - seo/geographic-foundation

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: seo/geographic-foundation

      - name: Replace stale trailing-slash location case
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/verify-seo-heads.mjs')
          text = path.read_text()
          old = 'const TRAILING_SLASH_CASES = ["/services/deep-cleaning/", "/locations/johannesburg/"];'
          new = 'const TRAILING_SLASH_CASES = ["/services/deep-cleaning/", "/locations/sandton/"];'
          if old not in text:
              raise SystemExit('Expected stale verifier line was not found; refusing to modify anything.')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Remove one-time workflow and commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-seo-verifier-once.yml
          git add scripts/verify-seo-heads.mjs
          git commit -m "test: align SEO verifier with approved service areas"
          git push origin HEAD:seo/geographic-foundation
