name: Format PR 87 once

on:
  push:
    branches:
      - fix/repair-live-form-build

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/repair-live-form-build

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format target file
        run: bunx prettier --write src/components/LiveFormSubmission.tsx

      - name: Commit formatter result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/LiveFormSubmission.tsx
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "style: format LiveFormSubmission.tsx with Prettier"
          git push origin HEAD:fix/repair-live-form-build
