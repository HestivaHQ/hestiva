name: Hestiva PR Check

on:
  push:
    branches:
      - agent/hestiva-rebrand
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check pull request diff integrity
        run: git diff --check "${{ github.event.pull_request.base.sha || github.event.before }}" HEAD

      - name: Scan tracked files for secrets
        run: node scripts/scan-tracked-secrets.mjs

      - name: Validate environment architecture
        run: bun run verify:environment

      - name: Type check
        run: bunx tsc --noEmit

      - name: Form security tests
        run: RESEND_API_KEY=test-only bun test src/lib/form-security.test.mjs src/lib/submission-result.test.mjs

      - name: Targeted lint
        run: bunx eslint src/lib/site.ts src/lib/contact.functions.ts src/lib/form-security.ts src/lib/rate-limit.ts src/lib/submission-result.ts src/lib/quote/email-service.ts src/lib/quote/file-validation.ts src/routes/__root.tsx src/routes/contact.tsx src/components/Navbar.tsx src/components/Footer.tsx src/components/HeroSection.tsx src/components/LiveFormSubmission.tsx scripts/validate-environment.mjs

      - name: Targeted format check
        run: bunx prettier --check src/lib/site.ts src/lib/contact.functions.ts src/lib/form-security.ts src/lib/rate-limit.ts src/lib/form-security.test.mjs src/lib/submission-result.ts src/lib/submission-result.test.mjs src/lib/quote/email-service.ts src/lib/quote/file-validation.ts src/routes/__root.tsx src/routes/contact.tsx src/components/Navbar.tsx src/components/Footer.tsx src/components/HeroSection.tsx src/components/LiveFormSubmission.tsx scripts/validate-environment.mjs docs/ARCHITECTURE.md docs/ENVIRONMENT.md docs/DEPLOYMENT.md docs/RECOVERY_GUIDE.md docs/TECHNICAL_WORK_LOG.md docs/CHANGELOG.md

      - name: Production build
        run: bun run build

      - name: Diagnose TanStack server function IDs
        run: node scripts/diagnose-server-function-ids.mjs

      - name: Runtime SEO verification
        run: bun run verify:seo

      - name: Validate Cloudflare Worker bundle (dry run)
        run: bunx wrangler deploy --dry-run
