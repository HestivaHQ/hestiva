name: Hestiva PR Check

on:
  push:
    branches:
      - agent/hestiva-rebrand
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Type check
        run: bunx tsc --noEmit

      - name: Targeted lint
        run: bunx eslint src/lib/site.ts src/routes/__root.tsx src/components/Navbar.tsx src/components/Footer.tsx src/components/HeroSection.tsx

      - name: Targeted format check
        run: bunx prettier --check src/lib/site.ts src/routes/__root.tsx src/components/Navbar.tsx src/components/Footer.tsx src/components/HeroSection.tsx

      - name: Production build
        run: bun run build

      - name: Runtime SEO verification
        run: bun run verify:seo
