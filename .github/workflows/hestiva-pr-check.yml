name: Hestiva PR Check

on:
  push:
    branches:
      - agent/hestiva-rebrand
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Type check
        run: bunx tsc --noEmit

      - name: Targeted lint
        run: >-
          bunx eslint
          src/lib/site.ts
          src/lib/seo.ts
          src/routes/__root.tsx
          'src/routes/services/$serviceSlug.tsx'
          'src/routes/locations/$locationSlug.tsx'
          src/components/Navbar.tsx
          src/components/Footer.tsx
          src/components/HeroSection.tsx

      - name: Targeted format check
        run: >-
          bunx prettier --check
          package.json
          scripts/verify-seo-heads.mjs
          src/lib/site.ts
          src/lib/seo.ts
          src/routes/__root.tsx
          'src/routes/services/$serviceSlug.tsx'
          'src/routes/locations/$locationSlug.tsx'
          src/components/Navbar.tsx
          src/components/Footer.tsx
          src/components/HeroSection.tsx

      - name: Production build
        run: bun run build

      - name: Verify rendered SEO heads
        run: bun run test:seo-heads
