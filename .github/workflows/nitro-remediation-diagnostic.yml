name: Hestiva Nitro Remediation Diagnostic

on:
  workflow_dispatch:

# Read-only diagnostic: published npm metadata is inspected without changing dependencies.
permissions:
  contents: read

jobs:
  inspect-published-metadata:
    name: Find a small upstream Nitro remediation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Inspect authoritative npm package metadata
        env:
          NODE_AUTH_TOKEN: ""
        run: |
          set -euo pipefail
          helper_dir="$(mktemp -d)"
          trap 'rm -rf "$helper_dir"' EXIT

          # Install the semver helper, its package metadata, and npm's lockfile outside the checkout.
          npm install --prefix "$helper_dir" --no-audit --no-fund --ignore-scripts --save-exact semver@7
          NODE_PATH="$helper_dir/node_modules" node <<'NODE'
          const fs = require('node:fs');
          const semver = require('semver');

          const registrySource = 'https://registry.npmjs.org/';
          const current = {
            nitro: '3.0.260603-beta',
            envRunner: '0.1.16',
            miniflare: '4.20260730.0',
            undici: '7.28.0',
          };
          const expectedCurrentNitroEnvRunnerRange = '^0.1.9';
          const fixedUndiciFloor = '7.29.0';

          async function getPackument(name) {
            const url = new URL(encodeURIComponent(name), registrySource).href;
            const response = await fetch(url, {
              headers: { Accept: 'application/vnd.npm.install-v1+json' },
            });
            if (!response.ok) {
              throw new Error(`npm registry request for ${name} failed: ${response.status} ${response.statusText}`);
            }
            const packument = await response.json();
            if (!packument || typeof packument.versions !== 'object' || typeof packument.time !== 'object') {
              throw new Error(`npm registry response for ${name} has malformed versions or publication-time metadata`);
            }
            return packument;
          }

          function manifest(packument, name, version) {
            const value = packument.versions[version];
            if (!value || typeof value !== 'object') throw new Error(`Missing published manifest for ${name}@${version}`);
            if (typeof packument.time[version] !== 'string') throw new Error(`Missing publication time for ${name}@${version}`);
            return value;
          }

          function declaration(pkg, dependency) {
            const dependencyRange = pkg.dependencies?.[dependency];
            const peerDependencyRange = pkg.peerDependencies?.[dependency];
            if (dependencyRange !== undefined && peerDependencyRange !== undefined) {
              throw new Error(`${pkg.name}@${pkg.version} declares ${dependency} as both a dependency and peer dependency`);
            }
            const range = dependencyRange ?? peerDependencyRange;
            if (typeof range !== 'string' || !semver.validRange(range)) {
              throw new Error(`${pkg.name}@${pkg.version} has no valid ${dependency} dependency or peer dependency declaration`);
            }
            return {
              type: dependencyRange !== undefined ? 'dependency' : 'peerDependency',
              range,
            };
          }

          // This models npm's highest-version range resolution: only published versions accepted by
          // semver.satisfies are eligible. Its default prerelease rules exclude prereleases unless
          // the range itself opts into the relevant prerelease tuple.
          function newestPublishedSatisfying(packument, name, range) {
            if (!semver.validRange(range)) throw new Error(`Invalid ${name} range: ${range}`);
            const matches = Object.keys(packument.versions)
              .filter((version) => semver.valid(version) && semver.satisfies(version, range))
              .sort(semver.rcompare);
            if (matches.length === 0) throw new Error(`No published ${name} version satisfies ${range}`);
            return matches[0];
          }

          function fixedUndiciDeclaration(range) {
            const normalizedRange = semver.validRange(range);
            if (!normalizedRange) throw new Error(`Cannot interpret Undici dependency range: ${range}`);
            const minimum = semver.minVersion(normalizedRange);
            if (!minimum) throw new Error(`Cannot determine minimum admitted Undici version for: ${range}`);
            return {
              range,
              minimumAdmittedVersion: minimum.version,
              fixed: semver.gte(minimum, fixedUndiciFloor),
            };
          }

          function classification(version) {
            return semver.prerelease(version) === null ? 'stable' : 'prerelease';
          }

          function inspectEnvRunner(version, packuments, currentNitroEnvRunnerRange) {
            const envManifest = manifest(packuments.envRunner, 'env-runner', version);
            const miniflareDeclaration = declaration(envManifest, 'miniflare');
            const miniflareVersion = newestPublishedSatisfying(
              packuments.miniflare,
              'miniflare',
              miniflareDeclaration.range,
            );
            const miniflareManifest = manifest(packuments.miniflare, 'miniflare', miniflareVersion);
            const undiciDeclaration = declaration(miniflareManifest, 'undici');
            const undici = fixedUndiciDeclaration(undiciDeclaration.range);
            return {
              version,
              publishedAt: packuments.envRunner.time[version],
              releaseType: classification(version),
              satisfiesCurrentNitroRange: semver.satisfies(version, currentNitroEnvRunnerRange),
              miniflareDeclaration,
              selectedMiniflare: {
                version: miniflareVersion,
                publishedAt: packuments.miniflare.time[miniflareVersion],
                major: semver.major(miniflareVersion),
                undiciDeclaration: { type: undiciDeclaration.type, ...undici },
              },
              fixed: undici.fixed,
            };
          }

          function inspectNitro(version, packuments) {
            const nitroManifest = manifest(packuments.nitro, 'nitro', version);
            const envRunnerDeclaration = declaration(nitroManifest, 'env-runner');
            const envRunnerVersion = newestPublishedSatisfying(
              packuments.envRunner,
              'env-runner',
              envRunnerDeclaration.range,
            );
            const envRunner = inspectEnvRunner(envRunnerVersion, packuments, envRunnerDeclaration.range);
            return {
              version,
              publishedAt: packuments.nitro.time[version],
              releaseType: classification(version),
              envRunnerDeclaration,
              selectedEnvRunner: envRunner,
              fixed: envRunner.fixed,
            };
          }

          function transitionRows(candidates, firstFixed, project) {
            if (candidates.length === 0) return [];
            const index = firstFixed ? candidates.findIndex((candidate) => candidate.version === firstFixed.version) : candidates.length - 1;
            return candidates.slice(Math.max(0, index - 2), Math.min(candidates.length, index + 3)).map(project);
          }

          (async () => {
            const [nitro, envRunner, miniflare] = await Promise.all([
              getPackument('nitro'),
              getPackument('env-runner'),
              getPackument('miniflare'),
            ]);
            const packuments = { nitro, envRunner, miniflare };

            const currentNitroManifest = manifest(nitro, 'nitro', current.nitro);
            const currentNitroEnvRunnerDeclaration = declaration(currentNitroManifest, 'env-runner');
            const currentNitroEnvRunnerRange = currentNitroEnvRunnerDeclaration.range;
            if (currentNitroEnvRunnerRange !== expectedCurrentNitroEnvRunnerRange) {
              throw new Error(`Current Nitro env-runner range changed: expected ${expectedCurrentNitroEnvRunnerRange}, found ${currentNitroEnvRunnerRange}`);
            }
            const currentEnvRunnerManifest = manifest(envRunner, 'env-runner', current.envRunner);
            const currentMiniflareDeclaration = declaration(currentEnvRunnerManifest, 'miniflare');
            const currentMiniflareManifest = manifest(miniflare, 'miniflare', current.miniflare);
            const currentUndiciDeclaration = declaration(currentMiniflareManifest, 'undici');
            if (!semver.satisfies(current.envRunner, currentNitroEnvRunnerRange) ||
                !semver.satisfies(current.miniflare, currentMiniflareDeclaration.range) ||
                currentUndiciDeclaration.range !== current.undici) {
              throw new Error('Published metadata no longer reproduces the expected current dependency path');
            }

            const envRunnerVersions = Object.keys(envRunner.versions)
              .filter((version) => semver.valid(version) && semver.gte(version, current.envRunner))
              .sort(semver.compare);
            if (envRunnerVersions.length === 0) throw new Error('No relevant env-runner releases found');
            const envRunnerCandidates = envRunnerVersions.map((version) =>
              inspectEnvRunner(version, packuments, currentNitroEnvRunnerRange));
            const firstEnvRunnerFixedWithinCurrentNitroRange = envRunnerCandidates.find((candidate) =>
              candidate.satisfiesCurrentNitroRange && candidate.fixed) ?? null;

            const nitroVersions = Object.keys(nitro.versions)
              .filter((version) => semver.valid(version) && semver.major(version) === 3 && semver.gt(version, current.nitro))
              .sort(semver.compare);
            const nitroCandidates = nitroVersions.map((version) => inspectNitro(version, packuments));
            const firstFixedNitro3 = nitroCandidates.find((candidate) => candidate.fixed) ?? null;

            const report = {
              current,
              currentNitroEnvRunnerRange,
              firstEnvRunnerFixedWithinCurrentNitroRange,
              firstFixedNitro3,
              envRunnerCandidates,
              nitroCandidates,
              resolutionMethod: {
                dependencies: 'Highest published valid semver satisfying the complete declared range, using semver.satisfies default prerelease semantics; candidates are ordered by semver ascending to identify the earliest qualifying release.',
                undiciFixed: `The complete published declaration is parsed with semver.validRange() and is fixed only when semver.minVersion() is >=${fixedUndiciFloor}.`,
              },
              registrySource,
              generatedAt: new Date().toISOString(),
            };
            fs.writeFileSync('nitro-remediation-report.json', `${JSON.stringify(report, null, 2)}\n`);

            console.log(`Current dependency path:\n${current.nitro} -> ${current.envRunner} -> ${current.miniflare} -> ${current.undici}`);
            console.log(`\nCurrent Nitro env-runner range:\n${currentNitroEnvRunnerRange}`);
            console.log(`\nFirst fixed env-runner within current Nitro range:\n${firstEnvRunnerFixedWithinCurrentNitroRange?.version ?? 'NONE FOUND'}`);
            if (firstEnvRunnerFixedWithinCurrentNitroRange) {
              const candidate = firstEnvRunnerFixedWithinCurrentNitroRange;
              console.log(`env-runner: ${candidate.version}`);
              console.log(`Miniflare: ${candidate.selectedMiniflare.version} (${candidate.miniflareDeclaration.range})`);
              console.log(`Undici: ${candidate.selectedMiniflare.undiciDeclaration.range}`);
            }
            console.log(`\nFirst fixed Nitro 3:\n${firstFixedNitro3?.version ?? 'NONE FOUND'}`);
            if (firstFixedNitro3) {
              const candidate = firstFixedNitro3;
              console.log(`Nitro: ${candidate.version}`);
              console.log(`env-runner: ${candidate.selectedEnvRunner.version} (${candidate.envRunnerDeclaration.range})`);
              console.log(`Miniflare: ${candidate.selectedEnvRunner.selectedMiniflare.version} (${candidate.selectedEnvRunner.miniflareDeclaration.range})`);
              console.log(`Undici: ${candidate.selectedEnvRunner.selectedMiniflare.undiciDeclaration.range}`);
            }

            console.log('\nEnv-runner transition table:');
            console.table(transitionRows(envRunnerCandidates, firstEnvRunnerFixedWithinCurrentNitroRange, (candidate) => ({
              envRunner: candidate.version,
              inCurrentNitroRange: candidate.satisfiesCurrentNitroRange,
              miniflare: candidate.selectedMiniflare.version,
              undici: candidate.selectedMiniflare.undiciDeclaration.range,
              fixed: candidate.fixed,
            })));
            console.log('\nNitro 3 transition table:');
            console.table(transitionRows(nitroCandidates, firstFixedNitro3, (candidate) => ({
              nitro: candidate.version,
              envRunner: candidate.selectedEnvRunner.version,
              miniflare: candidate.selectedEnvRunner.selectedMiniflare.version,
              undici: candidate.selectedEnvRunner.selectedMiniflare.undiciDeclaration.range,
              fixed: candidate.fixed,
            })));
            if (!firstEnvRunnerFixedWithinCurrentNitroRange && !firstFixedNitro3) {
              console.log('\nNO SMALL UPSTREAM REMEDIATION CURRENTLY AVAILABLE');
            }
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

      - name: Validate machine-readable report
        run: |
          set -euo pipefail
          test -s nitro-remediation-report.json
          jq -e '
            (.current | type == "object") and
            ([.current.nitro, .current.envRunner, .current.miniflare, .current.undici] | all(type == "string" and length > 0)) and
            (.currentNitroEnvRunnerRange | type == "string" and length > 0) and
            ((.firstEnvRunnerFixedWithinCurrentNitroRange | type) == "null" or
             (.firstEnvRunnerFixedWithinCurrentNitroRange | type) == "object") and
            ((.firstFixedNitro3 | type) == "null" or (.firstFixedNitro3 | type) == "object") and
            (.envRunnerCandidates | type == "array" and length > 0) and
            (.nitroCandidates | type == "array") and
            (.registrySource == "https://registry.npmjs.org/") and
            (.generatedAt | type == "string" and length > 0) and
            ([.envRunnerCandidates[] |
              (.version | type == "string" and length > 0) and
              (.publishedAt | type == "string" and length > 0) and
              (.releaseType == "stable" or .releaseType == "prerelease") and
              (.satisfiesCurrentNitroRange | type == "boolean") and
              (.miniflareDeclaration.type == "dependency" or .miniflareDeclaration.type == "peerDependency") and
              (.miniflareDeclaration.range | type == "string" and length > 0) and
              (.selectedMiniflare.version | type == "string" and length > 0) and
              (.selectedMiniflare.major | type == "number") and
              (.selectedMiniflare.undiciDeclaration.range | type == "string" and length > 0) and
              (.selectedMiniflare.undiciDeclaration.minimumAdmittedVersion | type == "string" and length > 0) and
              (.fixed | type == "boolean")
            ] | all) and
            ([.nitroCandidates[] |
              (.version | type == "string" and length > 0) and
              (.publishedAt | type == "string" and length > 0) and
              (.releaseType == "stable" or .releaseType == "prerelease") and
              (.envRunnerDeclaration.type == "dependency" or .envRunnerDeclaration.type == "peerDependency") and
              (.envRunnerDeclaration.range | type == "string" and length > 0) and
              (.selectedEnvRunner.version | type == "string" and length > 0) and
              (.selectedEnvRunner.selectedMiniflare.version | type == "string" and length > 0) and
              (.selectedEnvRunner.selectedMiniflare.undiciDeclaration.range | type == "string" and length > 0) and
              (.fixed | type == "boolean")
            ] | all)
          ' nitro-remediation-report.json >/dev/null

          helper_dir="$(mktemp -d)"
          trap 'rm -rf "$helper_dir"' EXIT
          npm install --prefix "$helper_dir" --no-audit --no-fund --ignore-scripts --save-exact semver@7
          NODE_PATH="$helper_dir/node_modules" node <<'NODE'
          const semver = require('semver');
          const report = require(`${process.cwd()}/nitro-remediation-report.json`);

          function verifyCandidate(candidate, kind) {
            const envRunner = kind === 'nitro' ? candidate.selectedEnvRunner : candidate;
            if (!envRunner?.miniflareDeclaration?.range || !envRunner?.selectedMiniflare?.version) {
              throw new Error(`Incomplete ${kind} candidate dependency chain`);
            }
            const undici = envRunner.selectedMiniflare.undiciDeclaration;
            const validRange = semver.validRange(undici?.range);
            const minimum = validRange && semver.minVersion(validRange);
            if (!minimum || minimum.version !== undici.minimumAdmittedVersion) {
              throw new Error(`Invalid ${kind} candidate Undici minimum`);
            }
            const provenFixed = semver.gte(minimum, '7.29.0');
            if (candidate.fixed !== provenFixed || undici.fixed !== provenFixed) {
              throw new Error(`Incorrect ${kind} candidate fixed classification`);
            }
          }

          report.envRunnerCandidates.forEach((candidate) => verifyCandidate(candidate, 'env-runner'));
          report.nitroCandidates.forEach((candidate) => verifyCandidate(candidate, 'nitro'));
          if (report.firstEnvRunnerFixedWithinCurrentNitroRange) {
            const candidate = report.firstEnvRunnerFixedWithinCurrentNitroRange;
            verifyCandidate(candidate, 'env-runner');
            if (!candidate.satisfiesCurrentNitroRange || !candidate.fixed) {
              throw new Error('Reported env-runner remediation is not eligible and fixed');
            }
          }
          if (report.firstFixedNitro3) {
            verifyCandidate(report.firstFixedNitro3, 'nitro');
            if (!report.firstFixedNitro3.fixed) throw new Error('Reported Nitro remediation is not fixed');
          }
          NODE

      - name: Upload remediation metadata report
        uses: actions/upload-artifact@v4
        with:
          name: nitro-remediation-report
          path: nitro-remediation-report.json
          if-no-files-found: error
          retention-days: 14
