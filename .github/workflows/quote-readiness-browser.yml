name: Quote Readiness Browser Test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "src/routes/quote.tsx"
      - "src/components/LaundryOperatingModelEnhancement.tsx"
      - "src/components/QuoteFormStabilityEnhancement.tsx"
      - "src/components/StructuredQuoteSubmission.tsx"
      - "src/components/LiveFormSubmission.tsx"
      - "src/lib/quote/**"
      - "tests/browser/**"
      - "playwright.config.mjs"
      - ".github/workflows/quote-readiness-browser.yml"

permissions:
  contents: read

jobs:
  quote-browser-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Install application dependencies
        run: bun install --frozen-lockfile

      - name: Install CI-only Playwright test runner
        run: npm install --no-save --ignore-scripts @playwright/test@1.54.2

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run quote readiness browser matrix
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quote-readiness-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
