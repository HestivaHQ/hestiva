name: Temporary About Founder Noop
on:
  push:
    branches:
      - seo/about-founder-trust
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/about-founder-trust
      - run: |
          git rm .github/workflows/temp-about-founder-noop.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove temporary noop workflow"
          git push origin HEAD:seo/about-founder-trust