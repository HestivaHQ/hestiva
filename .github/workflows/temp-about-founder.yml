name: Temporary About Founder Wiring
on:
  push:
    branches:
      - seo/about-founder-trust
permissions:
  contents: write
jobs:
  wire-founder:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/about-founder-trust
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - name: Wire founder section into About page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/about.tsx')
          s = p.read_text()
          import_anchor = 'import { Footer } from "@/components/Footer";\n'
          import_line = 'import { FounderSection } from "@/components/FounderSection";\n'
          if import_line not in s:
              if import_anchor not in s:
                  raise SystemExit('Footer import anchor not found')
              s = s.replace(import_anchor, import_anchor + import_line, 1)
          section_anchor = '        <section aria-labelledby="principles-heading" className="bg-[#FFFDF8] px-6 py-20 md:py-28">'
          founder = '        <FounderSection />\n\n'
          if '<FounderSection />' not in s:
              if section_anchor not in s:
                  raise SystemExit('Principles section anchor not found')
              s = s.replace(section_anchor, founder + section_anchor, 1)
          p.write_text(s)
          PY
          bun install --frozen-lockfile
          bunx prettier --write src/routes/about.tsx src/components/FounderSection.tsx
      - name: Commit implementation and remove temporary workflow
        run: |
          rm .github/workflows/temp-about-founder.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/about.tsx src/components/FounderSection.tsx .github/workflows/temp-about-founder.yml
          git commit -m "seo: integrate founder trust content"
          git push origin HEAD:seo/about-founder-trust
