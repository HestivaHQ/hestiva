name: Update favicon performance documentation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-docs:
    name: Update favicon performance documentation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Update canonical documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          log = Path('docs/TECHNICAL_WORK_LOG.md')
          text = log.read_text()
          marker = ('This append-only log records verified engineering and material operational work without reconstructing unsupported history. '
                    'Add newest entries first. Link pull requests/commits when available and describe validation without including secrets or customer data.\n\n')
          entry = '''## 2026-08-11 — Corrected oversized favicon assets after post-WebP production measurement\n\n**Purpose:** Remove the remaining evidence-backed static-asset waste identified after responsive WebP delivery materially improved production Lighthouse results.\n\n**Work recorded:**\n\n- reviewed production Lighthouse run `31457228551` from merged `main` commit `4f6002d8f7b0a76cddf07837377387afcdec7a66`;\n- recorded post-WebP median homepage performance `93`, LCP `2.70 s`, and transfer `2.54 MB`, compared with baseline `72`, `16.621 s`, and `5.328 MB`;\n- recorded post-WebP median Services performance `93`, LCP `2.70 s`, and transfer `2.61 MB`, compared with baseline `78`, `5.052 s`, and `9.692 MB`;\n- verified the remaining `favicon-16.png` and `favicon-32.png` files were incorrectly stored at `1254×1254` despite being declared as 16×16 and 32×32 browser icons;\n- resized the existing favicon artwork to the declared dimensions and saved optimized PNGs without changing favicon paths or HTML references;\n- reduced `favicon-16.png` from `1,143,225` bytes to `657` bytes and `favicon-32.png` from `1,157,806` bytes to `1,864` bytes; and\n- introduced no runtime dependency, routing, SEO policy, quote-flow, pricing, deployment-authority, or Website ↔ HestivaOS integration change.\n\n**Verification state:** Binary dimensions and byte sizes were verified in GitHub Actions. Full repository CI and a final production Lighthouse comparison remain required before closing the performance audit.\n\n'''
          if entry not in text:
              text = text.replace(marker, marker + entry, 1)
              log.write_text(text)

          changelog = Path('docs/CHANGELOG.md')
          text = changelog.read_text()
          anchor = ('- Recorded the first production Lighthouse baseline and responded to its image-transfer bottleneck by adding responsive WebP delivery for the homepage hero, service imagery, and shared white logo while preserving approved PNG fallbacks; post-deployment Lighthouse verification remains required before claiming measured production improvement (PR #110).\n')
          bullet = ('- Verified the post-WebP production improvement, then corrected the two remaining oversized favicon files from 1254×1254 source images to true 16×16 and 32×32 optimized PNGs, reducing them from roughly 2.30 MB combined to 2,521 bytes while preserving their existing public paths (PR #111).\n')
          if bullet not in text:
              text = text.replace(anchor, anchor + bullet, 1)
              changelog.write_text(text)

          audit = Path('docs/PERFORMANCE_AUDIT.md')
          text = audit.read_text()
          old = ('A second production Lighthouse run is required after deployment before claiming a production performance improvement. '
                 'The source and asset changes establish a strong transfer-size expectation, but production scores and Core Web Vitals are not recorded as improved until measured.\n\n')
          replacement = '''A second production Lighthouse run was completed after deployment, as recorded below.\n\n## Verified post-WebP production comparison\n\nGitHub Actions run `31457228551` audited production from merged `main` commit `4f6002d8f7b0a76cddf07837377387afcdec7a66` using the same three-run mobile method. Median values were:\n\n| Page | Performance | LCP | Total transfer |\n| --- | ---: | ---: | ---: |\n| Homepage | 93 | 2.70 s | 2.54 MB |\n| Services | 93 | 2.70 s | 2.61 MB |\n| Quote | 94 | 2.53 s | 2.50 MB |\n\nCompared with the original baseline, homepage performance increased from 72 to 93, homepage median LCP fell from 16.621 s to 2.70 s, and transfer fell from 5.328 MB to 2.54 MB. Services performance increased from 78 to 93, median LCP fell from 5.052 s to 2.70 s, and transfer fell from 9.692 MB to 2.61 MB. Quote performance remained effectively unchanged while transfer decreased.\n\nOne homepage run remained anomalous with a long render delay despite the optimized hero being selected at roughly 54 KB; this is recorded as run-to-run volatility rather than evidence that the multi-megabyte hero returned.\n\n## Favicon follow-up\n\nThe post-WebP reports exposed a separate static-asset defect: `favicon-16.png` and `favicon-32.png` were each stored as 1254×1254 PNGs even though the HTML declares them as 16×16 and 32×32 icons. GitHub Actions verified the original sizes at 1,143,225 bytes and 1,157,806 bytes. PR #111 resizes the same artwork to the declared dimensions and writes optimized PNGs at the same public paths, producing 657-byte and 1,864-byte files respectively.\n\nThis favicon change removes roughly 2.30 MB of avoidable transfer without changing favicon URLs, metadata semantics, routing, or visual branding intent. A final production Lighthouse run is still required after deployment before the performance audit is closed.\n\n'''
          if old in text:
              text = text.replace(old, replacement, 1)
          audit.write_text(text)
          PY

      - name: Commit documentation and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/TECHNICAL_WORK_LOG.md docs/CHANGELOG.md docs/PERFORMANCE_AUDIT.md
          git rm .github/workflows/update-favicon-docs.yml
          git commit -m "docs: record favicon performance correction"
          git push origin "HEAD:${{ github.head_ref }}"
